name: App release
# Push a tag like desktop-v0.2.0 to build Bubble AI for Mac (Apple silicon and Intel), Windows,
# Linux and Android and attach the builds to a GitHub release, marked latest. Installed apps find it there and update
# themselves (apps/desktop/src/updater.cjs). The file names never change between versions, so
# The repository's releases/latest/download/<name> URL always links the newest one.
# Macs are signed and notarized when the repository has the Apple secrets (docs/signing.md), and signed
# ad hoc without them (scripts/after-sign.cjs). Windows builds are unsigned for now.
# Release notes come from docs/releases/<version>.md when it exists, followed by the merged pull requests.
#
# Dry run: run this workflow by hand (Actions → App release → Run workflow, or
# `gh workflow run desktop-release.yml --ref <branch> -f version=0.1.0`). It builds every platform the
# same way and keeps the files as workflow artifacts; it creates no tag and no release.
#
# Android: the android job calls android-release.yml, which builds Bubble-AI-android.apk (release-signed with the
# ANDROID_KEYSTORE_* secrets, debug-signed and labelled so without them) and attaches it to the same release.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the dry-run builds
        default: 0.1.0
env:
  GH_REPO: ${{ github.repository }}
  # the tag's version on a release, the input's on a dry run
  VERSION: ${{ github.event_name == 'push' && github.ref_name || format('desktop-v{0}', inputs.version) }}
  PUBLISH: ${{ github.event_name == 'push' }}
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          V="${VERSION#desktop-v}"
          notes="docs/releases/$V.md"
          [ -f "$notes" ] || notes=/dev/null
          echo "Title: Bubble AI $V"; echo "Notes: $notes"
          [ "$PUBLISH" = true ] || { echo "Dry run: no release created"; exit 0; }
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "Bubble AI $V" --notes-file "$notes" --generate-notes --verify-tag --latest
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: build (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            dist: --mac --arm64
          # Intel Macs, built on Apple silicon (GitHub's Intel runners never started): the bundled
          # native modules are fetched for x64 (BUBBLE_BUNDLE_ARCH) and electron-builder packs an x64 app
          - name: mac-x64
            os: macos-15
            dist: --mac --x64
            arch: x64
          # installs to %LOCALAPPDATA%\Programs\Bubble AI (a per-user installer names its folder after the package)
          - name: windows-x64
            os: windows-latest
            dist: --win --x64 "-c.extraMetadata.name=Bubble AI"
          - name: linux-x64
            os: ubuntu-latest
            dist: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the app's version comes from the tag
      - run: npm version "${VERSION#desktop-v}" --no-git-tag-version --allow-same-version -w @bubble-ai/desktop
        shell: bash
      - run: npm run bundle -w @bubble-ai/desktop
        env:
          BUBBLE_BUNDLE_ARCH: ${{ matrix.arch }}
      - run: |
          # Only Macs get these, and only when set: electron-builder would read CSC_LINK as a Windows certificate too
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERT" ]; then
            export CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD" APPLE_ID="$NOTARY_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
          fi
          npx electron-builder ${{ matrix.dist }} --publish never
        shell: bash
        working-directory: apps/desktop
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # a signed build has to pass Gatekeeper before it reaches the release
      - if: runner.os == 'macOS'
        run: |
          [ -n "$MAC_CERT" ] || { echo "No Apple secrets: this build is signed ad hoc"; exit 0; }
          app=$(find apps/desktop/dist -maxdepth 2 -iname '*.app' | head -n 1)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
      # Wisp apps from before the rename look for Wisp-* files (and old download links point at them),
      # so every build goes up under both names. Drop the Wisp-* copies once few Wisp installs are left.
      - run: |
          cd apps/desktop/dist
          for f in Bubble-AI-*; do [ -f "$f" ] && cp "$f" "Wisp-${f#Bubble-AI-}"; done
          ls -l Bubble-AI-* Wisp-*
          [ "$PUBLISH" = true ] || exit 0
          gh release upload "$VERSION" Bubble-AI-* Wisp-* --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/desktop/dist/Bubble-AI-*
          retention-days: 7

  # the agents' VM image for this release's recipe, from vm-image.yml, so installed apps pull it
  # instead of building it themselves (skipped when it's published already; built, not pushed, on a dry run)
  vm-image:
    uses: ./.github/workflows/vm-image.yml
    with:
      publish: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write

  # the APK (Bubble-AI-android.apk plus a Wisp-android.apk copy), from android-release.yml: attached to the
  # release on a tag push, kept as an artifact on a dry run
  android:
    needs: release
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
