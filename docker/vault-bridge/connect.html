<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connect the agents' vault account</title>
<style>
  :root { color-scheme: light dark; --ink: #16181d; --muted: #6b7079; --line: #e3e5e9; --bg: #f6f7f9; --card: #fff; --accent: #3d6df2; --bad: #c62f2f; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eceef2; --muted: #9aa0aa; --line: #2b2f36; --bg: #111317; --card: #1a1d22; --accent: #6f93ff; --bad: #ff7a7a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { width: min(420px, 100% - 32px); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  input[type=email], input[type=password], input[type=text] { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--ink); font: inherit; }
  details { margin-top: 12px; font-size: 14px; } summary { cursor: pointer; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; font-size: 14px; color: var(--ink); }
  .check small { display: block; color: var(--muted); }
  button { margin-top: 20px; width: 100%; height: 42px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 14px; } .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Connect the agents' vault account</h1>
  <p>Sign in with the vault account you made for your agents, not your own. It goes straight to your vault; Wisp never sees it. Agents can only use logins in its “Agents” folder or collection.</p>
  <form id="f" autocomplete="off">
    <label for="email">Agents account email</label>
    <input id="email" type="email" autocomplete="off" required>
    <label for="password">Its master password</label>
    <input id="password" type="password" autocomplete="off" required>
    <details>
      <summary>Use an API key instead</summary>
      <label for="cid">client_id</label>
      <input id="cid" type="text" autocomplete="off" placeholder="user.…">
      <label for="csec">client_secret</label>
      <input id="csec" type="password" autocomplete="off">
    </details>
    <label class="check"><input id="lock" type="checkbox"><span>Lock when the server restarts<small>Safer, but agents can't sign in after a restart until you connect again.</small></span></label>
    <button id="go" type="submit">Connect</button>
    <div id="msg" class="msg" role="status"></div>
  </form>
</main>
<script>
  const code = location.hash.slice(1);
  history.replaceState(null, "", location.pathname);
  const $ = (id) => document.getElementById(id);
  const say = (text, bad) => { $("msg").textContent = text; $("msg").className = "msg" + (bad ? " bad" : ""); };
  if (!code) { say("This link is missing its code. Open Settings → Memory vault in Wisp and press Connect.", true); $("go").disabled = true; }
  $("cid").addEventListener("input", () => { $("email").required = !$("cid").value.trim(); });
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("go").disabled = true;
    say("Checking…");
    const body = { code, email: $("email").value, password: $("password").value, clientId: $("cid").value, clientSecret: $("csec").value, lockOnRestart: $("lock").checked };
    try {
      const r = await fetch(location.pathname, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), credentials: "omit", referrerPolicy: "no-referrer" });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "That didn't work");
      $("password").value = ""; $("csec").value = "";
      $("f").querySelectorAll("input,button,details").forEach((x) => (x.disabled = true));
      say(j.agentsFound ? "Connected. " + j.count + (j.count === 1 ? " login" : " logins") + " in Agents. You can close this tab." : "Connected, but this account has no folder or collection called “Agents” yet. Make one and put the logins agents may use in it.");
    } catch (err) {
      say(err.message, true);
      $("go").disabled = false;
    }
  });
</script>
</body>
</html>
