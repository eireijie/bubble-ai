# Generate Wisp.xcodeproj with XcodeGen: `brew install xcodegen && xcodegen` in apps/ios
# The project and targets are still called Wisp inside Xcode; people see Bubble AI (CFBundleDisplayName).
name: Wisp
options:
  bundleIdPrefix: ai.bubbleai
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Bubble AI and its tests do not declare App Intents.
    LM_SKIP_METADATA_EXTRACTION: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wisp:
    type: application
    platform: iOS
    sources: [Wisp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.bubbleai.ios
        PRODUCT_NAME: Wisp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bubble AI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Bubble AI connects to Bubble AI on your computer over your own network.
        INFOPLIST_KEY_NSCameraUsageDescription: Bubble AI uses the camera to scan the pairing code on your computer and to take photos you send.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Bubble AI uses the microphone so you can talk with your agents in a voice call.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Bubble AI turns what you say into text so your agent can answer.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: When an agent asks where you are, Bubble AI tells it. Only when it asks, never a running track.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Bubble AI tells your agents when you arrive at or leave a place you added. Never where you are in between.
        CODE_SIGN_STYLE: Automatic
        # YuVi LLC, the paid Apple developer team that publishes Bubble AI
        DEVELOPMENT_TEAM: 388D9S7Y7P
        # push notifications; Xcode switches this to production when you archive for TestFlight / the App Store
        CODE_SIGN_ENTITLEMENTS: Wisp/Wisp.entitlements
    info:
      path: Wisp/Info.plist
      properties:
        CFBundleDisplayName: Bubble AI
        # the launch screen takes the app's page colour (light and dark), so dark mode has no white flash
        UILaunchScreen:
          UIColorName: LaunchBackground
        # only standard HTTPS and TLS, so App Store Connect doesn't ask about encryption on every build
        ITSAppUsesNonExemptEncryption: false
        # pairing QR codes are wisp://pair links, so the Camera app opens them in Bubble AI
        CFBundleURLTypes:
          - CFBundleURLName: ai.bubbleai.pair
            CFBundleURLSchemes: [wisp, warren]
        # the Apple mod: a silent push asks where the phone is; places wake the app when you arrive or leave
        UIBackgroundModes: [location, remote-notification]
        # self-hosted hubs are often plain http on a home network or a Tailscale address
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
  WispTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WispTests]
    dependencies:
      - target: Wisp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.bubbleai.WispTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wisp.app/Wisp
        BUNDLE_LOADER: $(TEST_HOST)
  WispUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WispUITests]
    dependencies:
      - target: Wisp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.bubbleai.WispUITests
        TEST_TARGET_NAME: Wisp
schemes:
  Wisp:
    build:
      targets:
        Wisp: all
    test:
      targets: [WispTests, WispUITests]
      environmentVariables:
        BUBBLE_HUB: $(BUBBLE_HUB)
        BUBBLE_TOKEN: $(BUBBLE_TOKEN)
        WISP_HUB: $(WISP_HUB)
        WISP_TOKEN: $(WISP_TOKEN)
        WARREN_HUB: $(WARREN_HUB)
        WARREN_TOKEN: $(WARREN_TOKEN)
