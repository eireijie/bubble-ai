name: Windows smoke
# Proves the Windows desktop app builds, installs, starts its hub and gets through first-run setup.
# It never publishes: no tags, no releases. The installer is a workflow artifact only.
on:
  push:
    branches: [claude/windows-fix, claude/windows-bundled-git]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - name: desktop tests
        run: npx vitest run apps/desktop
      - name: hub, device and core tests
        if: always()
        run: npx vitest run apps/hub apps/node packages

  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle -w @bubble-ai/desktop
      - run: npx electron-builder --win --x64 "-c.extraMetadata.name=Bubble AI" --publish never
        shell: bash
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Bubble-AI-win-x64-installer
          path: apps/desktop/dist/Bubble-AI-win-x64.exe
          if-no-files-found: error
      - name: install silently
        shell: pwsh
        run: |
          $p = Start-Process -FilePath apps\desktop\dist\Bubble-AI-win-x64.exe -ArgumentList '/S' -Wait -PassThru
          "installer exit: $($p.ExitCode)"
          $found = @(Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles -Filter 'Bubble AI.exe' -Recurse -Depth 2 -ErrorAction SilentlyContinue)
          if (-not $found) { throw "Bubble AI.exe wasn't installed" }
          $exe = $found[0].FullName
          "installed at $exe"
          if ($exe -notlike '*\Programs\Bubble AI\Bubble AI.exe') { throw "expected ...\Programs\Bubble AI\Bubble AI.exe, got $exe" }
          Get-ChildItem (Split-Path $exe) | Select-Object Name | Format-Wide -Column 4
          "BUBBLE_EXE=$exe" >> $env:GITHUB_ENV
      # the installed app must not lean on the build folder (a junction pointing back into it would)
      - name: hide the build folder
        shell: pwsh
        run: |
          Rename-Item apps\desktop\build\wisp-runtime wisp-runtime-hidden
          Rename-Item apps\desktop\dist dist-hidden
          $res = Join-Path (Split-Path $env:BUBBLE_EXE) 'resources\wisp'
          Get-ChildItem "$res\node_modules\@bubble-ai" | Select-Object Name, LinkType, Target | Format-Table -AutoSize | Out-String -Width 300
          # most Windows computers have no Git, and the hub can't start without it: the app carries its own
          & "$res\git\cmd\git.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the app's own Git doesn't run" }
          if (-not (Test-Path "$res\git\ucrt64\libexec\git-core\git-http-backend.exe")) { throw "the app's Git has no http-backend (Obsidian sync)" }
          # the next two steps run the app with this runner's Git out of sight, as on a computer without it
          $path = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'git.exe')) }) -join ';'
          "NO_GIT_PATH=$path" >> $env:GITHUB_ENV
      - name: hub starts the way the app runs it (app binary as Node)
        shell: pwsh
        run: |
          $env:PATH = $env:NO_GIT_PATH
          if (Get-Command git -ErrorAction SilentlyContinue) { throw "this runner's Git is still on PATH: $((Get-Command git).Source)" }
          $res = Join-Path (Split-Path $env:BUBBLE_EXE) 'resources\wisp'
          $env:ELECTRON_RUN_AS_NODE = '1'; $env:PORT = '4848'; $env:BUBBLE_DATA_DIR = "$env:RUNNER_TEMP\hubdata"
          $p = Start-Process -FilePath $env:BUBBLE_EXE -ArgumentList "`"$res\bin\bubble-ai.mjs`"", 'hub', 'start' -WorkingDirectory $res -RedirectStandardOutput "$env:RUNNER_TEMP\hub.out" -RedirectStandardError "$env:RUNNER_TEMP\hub.err" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $r = Invoke-RestMethod http://127.0.0.1:4848/api/setup; "api/setup: $($r | ConvertTo-Json -Compress)"; $ok = $true } catch {}
            if ($p.HasExited) { break }
          }
          Get-Content "$env:RUNNER_TEMP\hub.out","$env:RUNNER_TEMP\hub.err" -ErrorAction SilentlyContinue | Select-Object -Last 60
          if (-not $ok) { throw 'hub never answered /api/setup' }
          $html = (Invoke-WebRequest http://127.0.0.1:4848/ -UseBasicParsing).Content
          if ($html -notmatch '<div id="root"') { $html.Substring(0, [Math]::Min(500, $html.Length)); throw 'web app not served at /' }
          'web app served at /'
          Stop-Process -Id $p.Id -Force
      - name: drive first-run setup in the installed app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\drive" | Out-Null
          Copy-Item .github\windows-smoke\drive.mjs "$env:RUNNER_TEMP\drive\"
          Push-Location "$env:RUNNER_TEMP\drive"
          npm init -y | Out-Null
          npm install --no-audit --no-fund playwright-core@1.55.0
          $env:PATH = $env:NO_GIT_PATH
          node drive.mjs $env:BUBBLE_EXE "$env:GITHUB_WORKSPACE\shots"
          if ($LASTEXITCODE -ne 0) { throw "first-run drive failed" }
      - name: collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item -Recurse -ErrorAction SilentlyContinue "$env:APPDATA\Bubble AI\logs" logs\app-logs
          Copy-Item -ErrorAction SilentlyContinue "$env:USERPROFILE\.bubble-ai\*.log" logs\
          Copy-Item -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\hub.out","$env:RUNNER_TEMP\hub.err" logs\
          Get-ChildItem -Recurse logs | ForEach-Object { "== $($_.FullName)"; if (-not $_.PSIsContainer) { Get-Content $_.FullName -Tail 80 } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-run-screens-and-logs
          path: |
            shots
            logs
