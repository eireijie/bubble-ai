name: Android APK
# Builds the Android app as Bubble-AI-android.apk (plus a Wisp-android.apk copy, so old download links keep working).
#
# - Called by the app release (desktop-release.yml) with publish: true on a desktop-v* tag: the APK is attached to
#   that release, next to the desktop builds.
# - On pull requests that touch apps/android: built and kept as an artifact, to catch a broken build early.
# - Run by hand (Actions → Android APK → Run workflow, or `gh workflow run android-release.yml --ref <branch>`):
#   the APK is kept as a workflow artifact for 7 days. Set publish to attach it to an existing release instead.
#
# Signing: with the four ANDROID_* repository secrets below the APK is signed with the real release key, so
# every release can install over the last one. Without them it is signed with this run's debug key and labelled
# "debug-signed test build" on the release and in the run summary; each run has its own debug key, so testers
# must uninstall before installing a newer one. Secrets (see apps/android/README.md, "Release key"):
#   ANDROID_KEYSTORE_BASE64    the .jks upload/release keystore, base64-encoded on one line
#   ANDROID_KEYSTORE_PASSWORD  the keystore's password
#   ANDROID_KEY_ALIAS          the key's alias inside it
#   ANDROID_KEY_PASSWORD       the key's password (optional when it is the same as the keystore's)
on:
  workflow_call:
    inputs:
      version:
        description: Release tag (desktop-v0.1.0) or bare version (0.1.0)
        type: string
        required: true
      publish:
        description: Attach the APK to the release named by version
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  # pull requests that touch the Android app build it too (kept as an artifact, never published)
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (desktop-v0.1.0) or bare version (0.1.0)
        default: 0.1.0
      publish:
        description: Attach the APK to the existing release desktop-v<version>
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version || '0.1.0' }}
      PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
            echo "Signing with the release key (alias from ANDROID_KEY_ALIAS)"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
            echo "::warning title=Debug-signed APK::No ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets, so this APK is signed with a throwaway debug key. Fine for sideloading tests, not for Google Play, and it won't install over a build from another run."
          fi
      - name: Build
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V="${VERSION#desktop-v}"
          IFS=. read -r MA MI PA <<< "$V"
          PA="${PA%%[!0-9]*}"
          CODE=$(( 10#${MA:-0} * 10000 + 10#${MI:-0} * 100 + 10#${PA:-0} ))
          ./gradlew --no-daemon assembleRelease -PversionName="$V" -PversionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk Bubble-AI-android.apk
          cp Bubble-AI-android.apk Wisp-android.apk
      - name: Check the APK
        working-directory: apps/android
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs Bubble-AI-android.apk | tee certs.txt
          "$BT/aapt2" dump badging Bubble-AI-android.apk | grep -E "^(package|application-label|application-icon-160|sdkVersion|targetSdkVersion)" | tee badging.txt
          grep -q "name='ai.bubbleai.android'" badging.txt
          if [ "$SIGNED" = debug ]; then
            grep -q "CN=Android Debug" certs.txt
            LABEL="Bubble AI for Android ${VERSION#desktop-v} (debug-signed test build)"
          else
            LABEL="Bubble AI for Android ${VERSION#desktop-v}"
          fi
          echo "LABEL=$LABEL" >> "$GITHUB_ENV"
          {
            echo "### $LABEL"
            echo
            echo "Signed with the **$SIGNED** key. SHA-256: \`$(sha256sum Bubble-AI-android.apk | cut -d' ' -f1)\`"
            echo
            echo '```'; cat badging.txt; grep -E "certificate (DN|SHA-256)" certs.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.PUBLISH == 'true'
        name: Attach to the release
        run: |
          gh release upload "desktop-v${VERSION#desktop-v}" \
            "apps/android/Bubble-AI-android.apk#$LABEL" "apps/android/Wisp-android.apk#$LABEL (old name)" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-AI-android${{ env.SIGNED == 'debug' && '-debug-signed' || '' }}
          path: apps/android/Bubble-AI-android.apk
          retention-days: 7
